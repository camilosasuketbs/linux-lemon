tools:
- name: Shell
  fileStarter: {command: ~/code/simple/operating_system/operating_system-linux/tool/bin/launch_terminal,
    parameters: '${filePath}'}
  useForOpen: false
  waitUntilFinished: false
  filePattern: '*'
  forFilesNotDirectories: false
- name: Checkout
  fileStarter: {command: ~/code/simple/operating_system/operating_system-linux/tool/bin/launch_terminal_with_checkout,
    parameters: '${filePath}'}
  useForOpen: false
  waitUntilFinished: false
  filePattern: '*'
  forFilesNotDirectories: false
